name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/knowledge_base -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/knowledge_base/chat_ui.test.cjs
